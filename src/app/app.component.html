<div class="container py-5" style="max-width: 800px;">
  <!-- Encabezado -->
  <header class="text-center mb-4">
    <h1 class="fw-bold text-primary display-5 mb-1">
      <i class="bi bi-person-badge me-2"></i>Taller RxJS
    </h1>
    <p class="text-muted">Búsqueda de perfil y publicaciones</p>
  </header>

  <!-- Sección 1: Barra de búsqueda -->
  <section class="card shadow-sm border-0 rounded-3 mb-4">
    <div class="card-body p-3">
      <div class="input-group input-group-lg">
        <span class="input-group-text bg-white border-end-0">
          <i class="bi bi-search text-muted"></i>
        </span>
        <input
          #usernameInput
          type="text"
          class="form-control border-start-0"
          placeholder="Ingrese username (ej: emilys, atuny0)..."
          (keyup.enter)="buscarUsuario(usernameInput.value)"
        >
        <button
          class="btn btn-primary px-4 fw-semibold d-flex align-items-center"
          type="button"
          (click)="buscarUsuario(usernameInput.value)"
          [disabled]="cargando"
        >
          @if (cargando) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Buscando...
          } @else {
            <i class="bi bi-arrow-right-circle me-1"></i>
            Buscar
          }
        </button>
      </div>
    </div>
  </section>

  <!-- mensaje de error si información si el usuario no existe -->
  @if (mensaje) {
    <div class="alert alert-danger shadow-sm border-0 d-flex align-items-center mb-4" role="alert">
      <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
      <div>{{ mensaje }}</div>
    </div>
  }

  <!-- sección 2: Datos de usuario -->
  <app-datos-usuario [usuario]="usuario"></app-datos-usuario>

  <!-- sección 3: Publicaciones del usuario con comentarios -->
  @if (usuario) {
    <app-publicaciones [posts]="posts"></app-publicaciones>
  }
</div>
