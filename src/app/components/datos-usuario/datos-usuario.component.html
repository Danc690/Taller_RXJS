@if (usuario) {
  <div class="card shadow-sm border-0 rounded-3 my-3">
    <div class="card-body p-4">
      <div class="row align-items-center g-3">
        <div class="col-12 col-sm-auto text-center">
          <img
            [src]="usuario.image"
            [alt]="usuario.username"
            class="rounded-circle border border-3 border-primary-subtle shadow-sm bg-light"
            style="width: 100px; height: 100px; object-fit: cover;"
          >
        </div>
        <div class="col-12 col-sm text-center text-sm-start">
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-sm-start gap-2 mb-1">
            <h3 class="mb-0 fw-bold text-dark">
              {{ usuario.firstName }} {{ usuario.lastName }}
            </h3>
            <span class="badge text-bg-primary-subtle text-primary border border-primary-subtle">
              &#64;{{ usuario.username }}
            </span>
          </div>

          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-sm-start gap-3 mt-2 text-secondary small">
            <span>
              <i class="bi bi-envelope-fill text-primary me-1"></i>
              {{ usuario.email }}
            </span>
            <span>
              <i class="bi bi-telephone-fill text-primary me-1"></i>
              {{ usuario.phone }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
}
